name: CI Workflow - Docker

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t task-manager:latest .

      - name: Run Docker container
        run: |
          docker run --rm \
            -e GITHUB_USER="${{ github.actor }}" \
            -v "${{ github.workspace }}:/app" \
            task-manager:latest

      - name: Commit and push index.html update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "CI: update index.html task report for ${{ github.actor }}" || echo "No changes to commit"
          git push
